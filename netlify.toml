[build]
  command = "npm run build"
  publish = "dist"

# Single-page app: send all routes to index.html so React Router
# handles client-side routing (e.g. /players/abc123 on a hard refresh).
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"
